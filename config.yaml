    - stripe
    - airbnb
    - databricks
    - figma
    - notion
    - duolingo
    - doctolib
    - backmarket
    - alan
    - payfit
    - contentsquare
    - mirakl
    - pennylane
    - dataiku
    - hubspot
    - cloudflare
    - gitlab
