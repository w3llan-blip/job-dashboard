# Large groups' Workday career sites (Workday = the job system most big
# corporates use). Open the company's job site; if the address looks like
# https://xxx.wdN.myworkdayjobs.com/SiteName, copy it here.
workday:
  - name: Sanofi
    url: https://sanofi.wd3.myworkdayjobs.com/SanofiCareers
  - name: Airbus
    url: https://ag.wd3.myworkdayjobs.com/Airbus
  - name: Michelin
    url: https://michelinhr.wd3.myworkdayjobs.com/Michelin
  - name: Pernod Ricard
    url: https://pernodricard.wd3.myworkdayjobs.com/pernod-ricard

# Words searched on each Workday site (each = up to 60 offers per company)
workday_search:
  - VIE
  - V.I.E
  - graduate
  - stage
  - internship
  - intern
  - stage 2027
  - trainee

# Welcome to the Jungle: one search per line, like in the site's search
# bar. Companies under company_size.min_employees are dropped.
welcome_to_the_jungle:
  pages_per_query: 2      # 100 offers per page
  queries:
    - VIE
    - graduate program
    - stage strategie
    - stage strategy
    - stage business developer
    - stage chef de projet
    - stage product manager
    - stage transformation
    - stage supply chain
    - stage PMO
    - business analyst stage
    - chargé de mission stage
    - stage 6 mois strategie
    - internship strategy
    - visa sponsorship graduate

# France Travail (official API, needs a free key — see README).
france_travail:
  cadre_only: false       # internships are not "cadre" positions
  queries:
    - stage strategie
    - stage chef de projet
    - stage business developer
    - stage PMO
    - stage transformation
    - stage supply chain
    - graduate programme

# LinkedIn public job search (no account used). Keep the list of
# searches short — LinkedIn rate-limits heavy automated browsing.
linkedin:
  queries:
    - keywords: "stage strategie"
      location: "France"
    - keywords: "stage chef de projet"
      location: "Paris, France"
    - keywords: "stage business development"
      location: "France"
    - keywords: "strategy intern"
      location: "European Union"
    - keywords: "VIE"
      location: ""
    - keywords: "graduate programme"
      location: "European Union"
    - keywords: "strategy intern"
      location: "Canada"
    - keywords: "stage stratégie"
      location: "Montréal, Québec, Canada"
