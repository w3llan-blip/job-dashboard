# Only keep offers starting in this window (inclusive, format YYYY-MM).
# keep_undated: what to do with offers that don't state a start date
# (most company job posts are "start ASAP" and say nothing — set this
# to true around early 2027 so those come back).
start_window:
  from: "2027-01"          # VIE and graduate programs
  internship_from: "2027-03"   # internships: master's ends in April
  to: "2027-09"
  # true = offers that don't state a start date are KEPT (shown with a
  # "DATE ?" badge, ranked below offers whose date fits). With false, you
  # lose almost every non-VIE offer, because companies rarely write it.
  keep_undated: true

# Hard requirements you DON'T meet. If an offer's description clearly
# asks for one of these, the offer is removed (accents don't matter).
disqualifiers:
  # engineering degrees
  - engineering degree
  - degree in engineering
  - master's degree in engineering
  - bachelor's degree in engineering
  - engineering school
  - engineering background
  - background in engineering
  # "re:" lines are patterns: this one catches "formation ... ingénieur"
  # in any phrasing (formation d'ingénieur, formation supérieure type
  # ingénieur, ingénieur de formation...)
  - "re:formation[^.]{0,50}ingenieur"
  - "re:ingenieur[^.]{0,20}de formation"
  - ecole d'ingenieur
  - diplome d'ingenieur
  - ingenieur generaliste
  - profil ingenieur
  - profil technique
  # technical / scientific degrees
  - technical degree
  - computer science degree
  - degree in computer science
  - degree in mechanical
  - degree in electrical
  - degree in electronics
  - degree in acoustic
  - degree in physics
  - degree in chemistry
  # other fields that aren't you
  - medical degree
  - pharmacien
  - pharmacist
  - degree in law
  - law degree
  # real estate / wealth management degrees
  - "re:master[^.]{0,60}(?:immobili|gestion de patrimoine)"
  - "re:(?:degree|master'?s?|msc)[^.]{0,40}real estate"
  - real estate degree
  # visa: offers abroad that say they won't sponsor a work permit
  # (delete these lines if you get the right to work there)
  - no visa sponsorship
  - not able to sponsor
  - unable to sponsor
  - will not sponsor
  - cannot sponsor
  - can't sponsor
  - does not sponsor
  - do not sponsor
  - without sponsorship
  - sponsorship is not available
  - not offer visa sponsorship
  - "re:sponsorship[^.]{0,40}not (?:be )?(?:available|provided|offered)"
  - must have the right to work in the uk
  - us citizens only
  - "re:must be (?:a )?(?:us|u\\.s\\.) citizen"

