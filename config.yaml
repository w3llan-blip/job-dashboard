# Visa: as a French citizen you can work / intern anywhere in the
# EU/EEA and Switzerland. Outside (UK, US, Asia...), an offer is only kept
# if it's a VIE or if it explicitly says it sponsors the visa
# ("VISA ✓" badge on the dashboard). false = show everything.
visa:
  non_eu_requires_sponsorship: true
  # Internships kept WITHOUT the offer mentioning sponsorship: a French
  # student can get a work permit for a school internship himself
  # (Canada: Expérience internationale Canada, "Stage coop international").
  internship_ok_without_sponsorship:
    - canada
    - toronto
    - montreal
    - vancouver
    - quebec
    - ottawa
    - calgary
  # Places never shown outside VIE, even if the offer sponsors the visa
  # (empty = US offers that sponsor the visa are kept).
  never_except_vie: []

# Your school only validates the master's with a VIE, an internship or a
# graduate program: everything else (CDI, CDD, apprenticeship) is removed.
contracts:
  only_vie_internship_graduate: true

# Southern Europe (Spain, Italy, Portugal, Greece...) is only kept if the
# offer shows a salary at least this high (gross, per month). VIEs always
# pass: their allowance is set by Business France.
salary:
  south_europe_min_internship_month: 1000   # internships
  south_europe_min_month: 2500              # other jobs (≈ 30 k€/year)

# Languages: offers that require a language other than French/English/
# Spanish, or Spanish only, or that are written in another language,
# are removed. false = keep everything.
languages:
  enabled: true

# Company size: you want scale-ups and large groups, not early startups.
# Applies whenever the source knows the headcount (Welcome to the Jungle,
# France Travail). Unknown size = kept.
company_size:
  min_employees: 200
  keep_unknown: true

