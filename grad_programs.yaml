# la notification du jour te rappelle d'aller postuler.
# window commence par "Vérifié" quand les dates 2027 ont été lues sur la page
# officielle (octobre 2026) ; sinon c'est la tendance des années précédentes.
# Écartés volontairement : programmes marketing, programmes réservés aux
# ingénieurs, et programmes hors UE sans sponsoring de visa (UK, US).

