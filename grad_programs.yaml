# Graduate / early-career programs worth tracking for a 2027 start.
# opens_month = month applications typically open (1-12). On the 1st of
# that month, the daily notification reminds you to go check.
# Dates are typical patterns from previous years — always verify on the page.
# visa = what it means for a work permit. needs_sponsorship: true = the
# program is greyed out on the dashboard and gets no reminder.

- program: CVthèque VIE (be visible to companies)
  company: Business France
  url: https://mon-vie-via.businessfrance.fr
  opens_month: 10
  window: Anytime — create your profile now
  region: Worldwide
  visa: VIE — visa handled by Business France
  fit: 'Many VIEs are filled without a public ad: companies search the candidate database'

