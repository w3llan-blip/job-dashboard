name: Debug VIE offer
on:
  workflow_dispatch:
  push:
    paths: ['tools/debug_vie.py', '.github/workflows/debug-vie.yml']
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python tools/debug_vie.py 247846
