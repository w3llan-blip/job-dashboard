# Offres « star » : les offres « À postuler » de la veille tous les 3 jours
# (et des sélections), affichées dans l'onglet ⭐ Star du dashboard.
#
# Tenu par Claude : la veille ajoute ses nouvelles offres « À postuler » en
# haut de la liste, sans doublon (même id ou même lien = même offre).
# Ne jamais retirer une offre : changer plutôt son statut.
#
# statut = statut par défaut, connu de Claude. Dès que Saliou change le
# statut dans l'onglet, c'est son choix qui compte (il est enregistré dans
# son navigateur et dans le gist de synchro ; le workflow quotidien en
# recopie un résumé dans suivi_candidatures.json pour que Claude le lise).
# Statuts : À postuler, Dossier prêt, Postulé, Relancé, Entretien, Test,
#           Offre, Refusé, Pas pour moi, Expirée.
# dossier = dossier CV/lettre dans les fichiers du projet (/mnt/project-files/).

